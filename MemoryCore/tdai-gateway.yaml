# ============================================================
# TDAI Gateway — Standalone 单机版配置
# ============================================================
# 适用场景: 本地开发 / Hermes sidecar / 单 Agent 单机部署
# 特点: 零外部依赖 (不需要 Redis/Shark), 进程内状态管理
# ============================================================

deployMode: standalone
stateBackend: "local"

server:
  port: 8420
  host: "127.0.0.1"

data:
  baseDir: "~/.memory-tencentdb/memory-tdai"

# ── LLM (必填) ── 多厂商配置:activeProvider 选当前生效厂商,切换=改这一行+重启 Gateway
# 每厂商条目: baseUrl / apiKeyEnv(环境变量名,yaml 零明文) / model(当前使用) / models(可用清单)
#   extra.disableThinking: 该厂商蒸馏须关闭思考模式时置 true(DeepSeek 官方需要)
#   extra.headers: 附加请求头(如 OpenCode Go 2026-09-08 起要求的 x-opencode-session)
# env 覆盖链(优先级高于本文件折叠结果): TDAI_ACTIVE_PROVIDER / TDAI_LLM_BASE_URL /
#   TDAI_LLM_API_KEY(全局应急覆盖) / TDAI_LLM_MODEL / TDAI_LLM_MAX_TOKENS / TDAI_LLM_TIMEOUT_MS
# 厂商实测档案见 handoff-memory-config-provider-dev-20260908.md §4;新厂商接入后必须
#   实测一轮蒸馏(extracted>0)才算接入成功
llm:
  activeProvider: "opencode-go"
  providers:
    # 新增厂商: 追加条目即可(零代码改动),接入后必须跑一轮蒸馏验收
    - name: deepseek-official
      baseUrl: https://api.deepseek.com/v1
      apiKeyEnv: TDAI_KEY_DEEPSEEK
      model: deepseek-flash
      models:
        - deepseek-flash
        - deepseek-v4-pro
      extra:
        disableThinking: true
    - name: 智谱coding plan
      baseUrl: https://open.bigmodel.cn/api/coding/paas/v4
      apiKeyEnv: TDAI_KEY_ZHIPU
      model: glm-5.3-flash
      models:
        - glm-4.5
        - glm-4.5-air
        - glm-4.6
        - glm-4.7
        - glm-5
        - glm-5-turbo
        - glm-5.1
        - glm-5.2
        - glm-5.3
        - glm-5.3-flash
      extra:
        disableThinking: false
    - name: B.AI
      baseUrl: http://127.0.0.1:8789/v1
      apiKeyEnv: TDAI_KEY_B_AI
      model: glm-5.3-flash
      models:
        - minimax-m3
        - minimax-m2.7
        - glm-5.1
        - glm-5.2
        - gpt-5.6-sol
        - gpt-5.6-terra
        - gpt-5.6-luna
        - gpt-5.5
        - gpt-5.5-instant
        - gpt-5.4
        - gpt-5.2
        - gpt-5.4-pro
        - gpt-5.4-mini
        - gpt-5-mini
        - gpt-5.4-nano
        - gpt-5-nano
        - claude-fable-5.1
        - claude-fable-5
        - claude-opus-5
        - claude-opus-4.8
        - claude-opus-4.7
        - claude-opus-4.6
        - claude-opus-4.5
        - claude-sonnet-5
        - claude-sonnet-4.6
        - claude-sonnet-4.5
        - claude-haiku-4.5
        - gemini-3.1-pro
        - gemini-3-flash
        - gemini-3.5-flash-lite
        - gemini-3.6-flash
        - hy3
        - mimo-v2.5
        - glm-5.3-flash
        - kimi-k2.6
        - glm-5.3
        - mimo-v2.5-pro
        - hy4-preview
        - kimi-k3
        - qwen3.8-flash
        - qwen3.8-max
        - qwen3.8-27b
        - deepseek-v4-flash
        - deepseek-v4-flash-vision-exp
        - gemini-3.8-flash
        - deepseek-v4-pro
        - gemini-3.5-flash
        - gpt-6-astra
      extra:
        disableThinking: false
    - name: opencode-go
      baseUrl: https://opencode.ai/zen/go/v1
      apiKeyEnv: TDAI_KEY_OPENCODE
      model: deepseek-flash
      models:
        - minimax-m3
        - minimax-m2.7
        - minimax-m2.5
        - kimi-k3
        - kimi-k2.7-code
        - kimi-k2.6
        - longcat-2.0
        - kimi-k2.5
        - glm-5.2
        - glm-5.3-flash
        - glm-5.3
        - glm-5.1
        - glm-5
        - deepseek-v4-pro
        - deepseek-v4-flash
        - deepseek-flash
        - deepseek-v4-flash-vision-exp
        - qwen3.7-max
        - qwen3.8-max
        - qwen3.8-flash
        - qwen3.7-plus
        - qwen3.6-plus
        - qwen3.5-plus
        - mimo-v2-pro
        - mimo-v2-omni
        - mimo-v2.5-pro
        - mimo-v2.5
        - hy4-preview
        - hy3
        - hy3-preview
        - gpt-5.6-luna
        - grok-4.5
        - grok-4.6
        - muse-spark-1.3-contributor
        - muse-spark-1.2-contributor
        - omen-alpha
      extra:
        disableThinking: false
        headers:
          x-opencode-session: 8ae1bd54-2614-41ae-9ada-c21a2a3e7a00
  maxTokens: 4096
  timeoutMs: 120000
  # 分层覆盖(09-08 拍板):L1=全局默认(v4-flash 关思考);L2=v4-flash 开思考+大预算(场景合并是判断+综合任务);
  # L3=v4-pro 开思考(画像合成,每50轮低频)。层内显式 disableThinking:false 压过全局 env 兜底。
  # 改动任一层后必须实测该层蒸馏(extracted>0 / 场景正常更新)才算生效。
  layers:
    l2:
      maxTokens: 16384
      disableThinking: false
    l3:
      maxTokens: 16384
      disableThinking: false
      model: deepseek-flash
    l1:
      maxTokens: 4096
      disableThinking: true

# ── Memory 引擎配置 ──
memory:

  capture:
    enabled: true

  extraction:
    enabled: true
    enableDedup: true
    maxMemoriesPerSession: 20

  persona:
    triggerEveryN: 50
    maxScenes: 15

  pipeline:
    everyNConversations: 5
    enableWarmup: true
    l1IdleTimeoutSeconds: 600
    l2DelayAfterL1Seconds: 90
    l2MinIntervalSeconds: 900
    l2MaxIntervalSeconds: 3600

  recall:
    enabled: true
    maxResults: 5
    scoreThreshold: 0.3
    strategy: "keyword" # 合法值: keyword | embedding | hybrid。当前未配 embedding,用纯关键词(BM25/FTS)
    timeoutMs: 5000

  # ── 存储后端 ──
  # sqlite: 本地 SQLite (默认, 零配置)
  # tcvdb:  腾讯云向量数据库 (需填 tcvdb 配置)
  storeBackend: "sqlite"

  # 如需使用 TCVDB, 取消注释并填写:
  # storeBackend: "tcvdb"
  # tcvdb:
  #   url: "http://10.0.1.1:80"
  #   username: "root"
  #   apiKey: ""
  #   database: ""
  #   embeddingModel: "bge-large-zh"
  #   timeout: 10000

  embedding:
    provider: "none" # 默认关闭向量搜索, 仅用 BM25
    # 开启向量搜索示例:
    # provider: "openai"
    # baseUrl: "https://api.openai.com/v1"
    # apiKey: "${TDAI_LLM_API_KEY}"
    # model: "text-embedding-3-small"
    # dimensions: 1536

  bm25:
    enabled: true
    language: "zh"

# ── Skill 模块（可选，默认关闭）──
# Skill 是额外能力的加入，不影响上面的 Memory 引擎。
# 启用后 skill 数据存储在 {baseDir}/skills/ 目录下。
# 也可通过环境变量 TDAI_SKILL_ENABLED=true 启用。
# 09-13 用户拍板：开启基础档（库+10路由+检索注入），萃取档等面板 Skills 管理页批次再开。
skill:
  enabled: true
  routing:
    mode: "bm25"
    searchTopK: 20        # listing 接口最多注入多少条 skill（name+description）
  # extraction:           # 萃取档暂不开（与面板管理页捆绑，观察期结束后一批交付）
  #   enabled: true       # 需要 llm 配置有效
  #   maxIterations: 16
  resources:
    maxResourceSizeBytes: 5000000
    allowExecutable: false
