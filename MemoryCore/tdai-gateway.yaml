# ============================================================
# TDAI Gateway — v3 在役配置（快照 2026-10-19；2026-10-14 自 v2 upstream-eval 迁移）
# ============================================================
# 迁移时「v2 有而 v3 无」的能力此后已陆续移植回 v3（本文件 llm 块即最终形态）：
# 排空端点 d239d6b / 分层配置+关思考 5e23941 / 并发闸门+callDeadline+限流退避
# 1765221 / D2 指纹兜底 0acac07 / 请求头注入 f05b696 / 按厂商并发（面板 2026-10-18）。
# 剩余差异与挂账见 V3-MIGRATION-TRIAGE.md。切厂商优先走面板（自动清层 model 覆盖）。
# ── 密钥链 ──
#   厂商 key 经 yaml ${TDAI_KEY_*} 插值取得（当前 llm.apiKey=${TDAI_KEY_ZHIPU}，
#   zhipu-free）。启动件不得设 TDAI_LLM_API_KEY——env 优先于 yaml，设了会把别家
#   key 强塞给当前厂商（2026-10-16 起已从启动件摘除该行）。

deployMode: standalone
stateBackend: "local"

server:
  port: 8420
  host: "127.0.0.1"
  # apiKey 不填：v2/v3 接口本机开放（127.0.0.1 绑定，行为与 v2 在役一致）

data:
  baseDir: "~/.memory-tencentdb/memory-tdai"

# ── LLM（单厂商直连；当前在役 zhipu-free，2026-10-18 晚起）──
llm:
  # 厂商切换史（各带死因）：阶跃星辰（10-14~10-16 10:22，step 套餐额度耗尽）
  # → opencode-go/deepseek-v4.1-flash（10-16 11:24~14:45，402 额度尽；10-18 复查
  #   key 又 401 失效，复用需新 key）→ OpenRouter nemotron-3.5-super-vl:free
  #   （10-16 傍晚~10-18 08:47，free-models-per-day 日额度耗尽；UTC 0 点自愈但
  #   免费档额度扛不住日常蒸馏量）→ zhipu-free/glm-4.7-flash（10-18 晚起在役）。
  # 备选：智谱coding plan（open.bigmodel.cn/api/coding/paas/v4 订阅端点，key 同
  # TDAI_KEY_ZHIPU，已入面板目录，晚高峰可切）/ deepseek-official（按量付费）。
  baseUrl: "https://opencode.ai/zen/go/v1"
  # key 走 yaml 插值（启动件 set TDAI_KEY_ZHIPU）；注意启动件不得再设
  # TDAI_LLM_API_KEY——env 优先于 yaml，会把别家 key 强塞给本厂商。
  apiKey: "${TDAI_KEY_OPENCODE}"
  # 无自定义请求头：zhipu 不要求固定头（opencode-go 的 x-opencode-session 是
  # 上一家厂商的专项，切走即摘；headers 字段缺省=不发额外头）。
  # 厂商显示名（归属移植，v2 c00899f）：纯展示字段——L1 完成/延后/失败日志与
  # 面板蒸馏记录/死信两卡的「(厂商: 模型)」归属。不参与调用路由。
  providerLabel: "opencode-go"
  # 全局模型（l2/l3 未显式覆盖 model 时沿用）：glm-4.7-flash（zhipu 免费档）。
  # 已知边界：**上下文远小于 nemotron 的 1M**——L2/L3 长输入会撞 Prompt exceeds
  # max length（10-19 实测 6 次，400 不可重试），待决策分层大上下文模型；
  # 晚高峰易触发上游「访问量过大」（并发负载）与「已达到速率限制」（账户级 RPM，
  # 并发 1 也挡不住）两类限流，退避已兜底、游标不动数据不丢。
  model: "minimax-m3.1-flash-free"
  maxTokens: 65536
  timeoutMs: 120000
  # 进程级并发闸门：按 baseUrl 分桶限流，防多子系统调用叠加触发厂商秒拒；0/缺省=不限。
  # 按厂商并发（2026-10-18）：面板目录条目 maxConcurrency 随切换写入本值——zhipu-free
  # 内置 1（晚高峰持续拥堵实证，串行最稳）；条目无设定=保留现值（生效行有回显，
  # 上家残留可经「编」修改）。
  maxConcurrency: 4
  # 整调用硬期限（P1，承接 v2 在役值）：≥ 各层超时+一次退避预算；缺省=timeout×2+30s
  callDeadlineMs: 360000
  # 蒸馏分层覆盖（2026-10-15 移植 v2 llm.layers）。修迁移失误：v3 曾全层单模型
  # step-5-preview（含 L1 热路径），而 step-5 判死档案=单调用 1-5min/永远思考/并发
  # 幽灵——10-15 全天 dedup 240s 超时+concurrency reached 死信即该形态。
  # 分层机制与厂商无关。2026-10-18 起面板切换厂商会**自动清空各层 model 覆盖**
  # （残留旧厂商模型名在新厂商侧必 400 实证）；需分层异模型，切换后在管线图重新指定。
  # 五标量字段可按层覆盖：model/maxTokens/timeoutMs/disableThinking/callDeadlineMs；
  # 未配置字段沿用全局；面板「分层配置编辑」写入同结构；改后须重启网关，看
  # [l1] 锚点行确认生效值。disableThinking 三态：true 强制关（注入
  # thinking:{type:disabled}）/ false 不注入 / 缺省回落 env TDAI_DISABLE_THINKING。
  # 现状镜像 v2 在役口径：l1 关思考（deepseek-v4 系默认思考会烧光 max_tokens 致
  # content 空，v2 注释实证）；l2·l3 开思考（用户 10-15 令）。
  layers:
    l1:
      maxTokens: 64000
      timeoutMs: 300000
      thinkingLevel: low
      model: minimax-m3.1-flash-free
    l2:
      maxTokens: 128000
      timeoutMs: 600000
      callDeadlineMs: 660000
      thinkingLevel: max
      model: minimax-m3.1-flash-free
    l3:
      maxTokens: 128000
      timeoutMs: 600000
      callDeadlineMs: 660000
      thinkingLevel: max
      model: minimax-m3.1-flash-free
  headers:
    x-opencode-session: 8ae1bd54-2614-41ae-9ada-c21a2a3e7a00

# ── Memory 引擎 ──
memory:
  capture:
    enabled: true

  extraction:
    enabled: true
    enableDedup: true
    maxMemoriesPerSession: 20
    # P0-Fix1（承接 v2 在役值）：查重失败 fail-closed——失败整批延后（游标不动、
    # 数据不丢），不再免检入库；240s=step-5 判定常 >120s 的实测口径
    # （undici headersTimeout 300s 上限之内）。
    dedupFailFast: true
    dedupTimeoutMs: 240000
    # 用户身份白名单（v2 在役值承接）：仅这些姓名可保留在「用户（X）」里，
    # 其余（第三方姓名/角色标签/路径数字/状语）入库前归一为「用户」
    # 2026-10-20 批次 2.1 增补 Madin-H23：模型常写「用户（Weijian He / GitHub
    # Madin-H23）」这类同一身份的多写法，复合标签按分段匹配后需白名单覆盖到
    # 该署名，否则用户本人的别名会被误判成第三方姓名而丢弃。
    userIdentityNames:
      - 何伟健
      - heweijian
      - Weijian He
      - Madin-H23
    # D2 召回轻修（2026-10-14 灰度开启）：lexical=查重候选超额召回+词汇相似度重排；
    # 回退=改 none+重启
    dedupRecallRerank: lexical

  persona:
    triggerEveryN: 50
    # 场景数上限（2026-10-20 批次 2.3：20 -> 15，恢复上游默认）。此前调到 20
    # 关掉了上游唯一的减压阀：scene-extractor 的三级预警（黄/红/拒绝新建）只管
    # **文件个数**，而现场恰有 15 个场景文件，连黄色预警都不触发，场景块体积
    # 持续膨胀无阻。回落到 15 后，场景数触顶会真正触发上游的保护逻辑。
    maxScenes: 15
    triggerMode: current

  pipeline:
    everyNConversations: 5
    enableWarmup: true
    l1IdleTimeoutSeconds: 600
    l2DelayAfterL1Seconds: 90
    l2MinIntervalSeconds: 900
    l2MaxIntervalSeconds: 3600

  recall:
    enabled: true
    maxResults: 5
    scoreThreshold: 0.3
    strategy: "keyword" # v2 在役口径；v3 可选 hybrid（需 embedding）
    timeoutMs: 5000

  storeBackend: "sqlite"

  embedding:
    provider: "none"

  bm25:
    enabled: true
    language: "zh"

# （原 offload.l1MaxTokens/l1TimeoutMs/… 分层参数块已删 2026-10-15：无任何代码读取
#  的死配置，其口径已由 llm.layers 真正承接——maxTokens/timeoutMs 按层覆盖见上。）

# ── Skill 模块 ──
skill:
  enabled: true
  routing:
    mode: "bm25"
    searchTopK: 20
  # extraction 萃取档：v2 拍板「等面板批次再开」，迁移期保持关闭（v3 示例默认开，须显式关）
  extraction:
    enabled: false
  resources:
    maxResourceSizeBytes: 5000000
  # 注：v2 的 resources.allowExecutable 在 v3 未接线（写了也不拦截），已随迁移丢弃

  # ── 可观测性（全部关闭，与 v2 无遥测状态一致）──
observability:
  otel:
    enabled: false
  clickhouse:
    enabled: false
  kafka:
    enabled: false
  langfuse:
    enabled: false

analytics:
  clickhouse:
    enabled: false

# ── 元数据模块（standalone 模式不启用 mongo；保留 v3 示例骨架，env 缺省为空）──
metadata:
  maxUsersPerInstance: 500
  maxTeamsPerInstance: 100
  store:
    mongoUri: "${TDAI_METADATA_MONGO_URI}"
    mongoDbPrefix: "${TDAI_METADATA_MONGO_DB_PREFIX}"
    mongoTransactions: true
  systemUser:
    memory:
      userId: "${TDAI_MEMORY_SYSTEM_USER_ID}"
      displayName: "${TDAI_MEMORY_SYSTEM_USER_NAME}"
      userKey: "${TDAI_MEMORY_SYSTEM_USER_KEY}"
