# ============================================================
# TDAI Gateway — Standalone 单机版配置
# ============================================================
# 适用场景: 本地开发 / Hermes sidecar / 单 Agent 单机部署
# 特点: 零外部依赖 (不需要 Redis/Shark), 进程内状态管理
# ============================================================

deployMode: standalone
stateBackend: "local"

server:
  port: 8420
  host: "127.0.0.1"

data:
  baseDir: "~/.memory-tencentdb/memory-tdai"

# ── LLM (必填) ── 多厂商配置:activeProvider 选当前生效厂商,切换=改这一行+重启 Gateway
# 每厂商条目: baseUrl / apiKeyEnv(环境变量名,yaml 零明文) / model(当前使用) / models(可用清单)
#   extra.disableThinking: 该厂商蒸馏须关闭思考模式时置 true(DeepSeek 官方需要)
#   extra.headers: 附加请求头(如 OpenCode Go 2026-09-08 起要求的 x-opencode-session)
# env 覆盖链(优先级高于本文件折叠结果): TDAI_ACTIVE_PROVIDER / TDAI_LLM_BASE_URL /
#   TDAI_LLM_API_KEY(全局应急覆盖) / TDAI_LLM_MODEL / TDAI_LLM_MAX_TOKENS / TDAI_LLM_TIMEOUT_MS
# 厂商实测档案见 handoff-memory-config-provider-dev-20260908.md §4;新厂商接入后必须
#   实测一轮蒸馏(extracted>0)才算接入成功
llm:
  activeProvider: "opencode-go"
  # 进程级厂商并发闸门(2026-10-13):step-5 端点并发限额 5。L1 抽取池(3)+L1 去重+
  # L2 场景定时任务+L3 画像各自发调用,无统一闸门时慢端点挂起的调用叠加新调用会被
  # 厂商 concurrency reached 秒拒(current:6/limit:5 死信 10 条)。压到 4 留 1 余量,
  # 挂起占位时新调用排队而非继续施压。0/缺省=不限。
  maxConcurrency: 4
  providers:
    # 新增厂商: 追加条目即可(零代码改动),接入后必须跑一轮蒸馏验收
    - name: 智谱coding plan
      baseUrl: https://open.bigmodel.cn/api/coding/paas/v4
      apiKeyEnv: TDAI_KEY_ZHIPU
      model: glm-5.3-flash
      models:
        - glm-4.5
        - glm-4.5-air
        - glm-4.6
        - glm-4.7
        - glm-5
        - glm-5-turbo
        - glm-5.1
        - glm-5.2
        - glm-5.3
        - glm-5.3-flash
      extra:
        disableThinking: false
    - name: deepseek-official
      baseUrl: https://api.deepseek.com/v1
      apiKeyEnv: TDAI_KEY_DEEPSEEK
      model: deepseek-flash
      models:
        - deepseek-flash
        - deepseek-v4-pro
      extra:
        disableThinking: true
    - name: B.AI
      baseUrl: http://127.0.0.1:8789/v1
      apiKeyEnv: TDAI_KEY_B_AI
      model: qwen3.8-flash
      models:
        - minimax-m3
        - minimax-m2.7
        - glm-5.1
        - glm-5.2
        - gpt-5.6-sol
        - gpt-5.6-terra
        - gpt-5.6-luna
        - gpt-5.5
        - gpt-5.5-instant
        - gpt-5.4
        - gpt-5.2
        - gpt-5.4-pro
        - gpt-5.4-mini
        - gpt-5-mini
        - gpt-5.4-nano
        - gpt-5-nano
        - claude-fable-5.1
        - claude-fable-5
        - claude-opus-5
        - claude-opus-4.8
        - claude-opus-4.7
        - claude-opus-4.6
        - claude-opus-4.5
        - claude-sonnet-5
        - claude-sonnet-4.6
        - claude-sonnet-4.5
        - claude-haiku-4.5
        - gemini-3.1-pro
        - gemini-3-flash
        - gemini-3.5-flash-lite
        - gemini-3.6-flash
        - hy3
        - mimo-v2.5
        - glm-5.3-flash
        - kimi-k2.6
        - glm-5.3
        - mimo-v2.5-pro
        - hy4-preview
        - kimi-k3
        - qwen3.8-flash
        - qwen3.8-max
        - qwen3.8-27b
        - deepseek-v4-flash
        - deepseek-v4-flash-vision-exp
        - gemini-3.8-flash
        - deepseek-v4-pro
        - gemini-3.5-flash
        - gpt-6-astra
      extra:
        disableThinking: false
    - name: zhipu-free
      baseUrl: https://open.bigmodel.cn/api/paas/v4
      apiKeyEnv: TDAI_KEY_ZHIPU
      model: glm-4.7-flash
      models:
        - glm-4.7-flash
        - glm-4.5-flash
        - glm-4-flash-250414
      extra:
        disableThinking: true
    - name: 阶跃星辰
      baseUrl: https://api.stepfun.com/step_plan/v1
      apiKeyEnv: TDAI_KEY_____
      model: step-5-preview
      models:
        - step-3.7-flash
        - step-router-v1
        - stepaudio-2.5-chat
        - stepaudio-2.5-tts
        - stepaudio-2.5-asr
        - stepaudio-2.5-realtime
        - step-image-edit-2
        - step-3.5-flash-2603
        - step-3.5-flash
        - step-5-preview
      extra:
        disableThinking: false
    - name: opencode-go
      baseUrl: https://opencode.ai/zen/go/v1
      apiKeyEnv: TDAI_KEY_OPENCODE
      model: deepseek-v4.1-flash
      models:
        - deepseek-v4-flash
        - deepseek-v4-flash-vision-exp
        - deepseek-flash
        - deepseek-v4.1-flash
        - deepseek-v4-pro
        - glm-5.1
        - glm-5.2
        - glm-5.3
        - grok-4.6
        - grok-4.7
        - muse-spark-1.2-contributor
        - muse-spark-1.3-contributor
        - glm-5.3-flash
        - omen-alpha
        - gpt-5.6-luna
        - gpt-6-luna
        - claude-haiku-5-5
        - hy3
        - hy4-preview
        - kimi-k2.6
        - kimi-k2.7-code
        - kimi-k3
        - mimo-v2.5
        - mimo-v2.6-flash
        - mimo-v2.5-pro
        - mimo-v2.6-pro
        - minimax-m2.5
        - minimax-m2.7
        - minimax-m3
        - space-bunny
        - longcat-2.0
        - longcat-2.5-preview-free
        - step-5-preview-free
        - qwen3.6-plus
        - qwen3.7-max
        - qwen3.8-max
        - qwen3.8-flash
        - qwen3.7-plus
      extra:
        disableThinking: false
        headers:
          x-opencode-session: 8ae1bd54-2614-41ae-9ada-c21a2a3e7a00
  maxTokens: 4096
  timeoutMs: 120000
  # 分层覆盖(2026-10-07 改):三层不再钉 model——模型跟随 activeProvider(厂商切换时三层自动跟随,
  # 面板切换恢复安全;此前钉 deepseek-v4.1-flash 导致换厂商必须手改三层,tdai-core.ts:665 的覆盖顺序)。
  # L1 抽取关思考(JSON 任务,思考烧预算);L2/L3 开思考(用户 10-07 拍板恢复原设计:场景合并/画像合成是判断任务)。
  # maxTokens 65536:免费模型 token 不计费,预算拉满消截断(实测 API 接受 65536;glm 思考模式在 900 预算下
  # 会烧光→finish=length,大预算下正常完成,实测 11.7s/137-token 输入)。免费档高峰有 429 限流,靠 worker 5/15/45s 退避。
  # 改动任一层后必须实测该层蒸馏(extracted>0 / 场景正常更新)才算生效。
  layers:
    l2:
      maxTokens: 65536
      disableThinking: false
      timeoutMs: 600000
    l3:
      maxTokens: 65536
      disableThinking: false
      timeoutMs: 600000
    l1:
      maxTokens: 32768
      disableThinking: true
      model: deepseek-v4.1-flash

# ── Memory 引擎配置 ──
memory:

  capture:
    enabled: true

  extraction:
    enabled: true
    enableDedup: true
    maxMemoriesPerSession: 20
    # 来源归属护栏：2026-09-25 拍板撤去（实测误杀率 ~60%，金标 recall 44%→24%）。
    # off = 纯 assistant 来源也入库（默认即 off，此处显式声明便于审计）。
    attributionGuard: "off"
    # 用户身份白名单：只有这些姓名允许出现在「用户（X）」括号里。
    # 其余（第三方姓名/角色标签/路径数字/时间状语…）入库前由确定性护栏归一为「用户」。
    userIdentityNames:
      - 何伟健
      - heweijian
      - Weijian He
    # 查重失败 fail-closed（S1，2026-10-12）：查重失败整批延后重试（游标不动、
    # 数据不丢），不再免检入库——免检是 L1 重复内容的主要新增源（5 天 53 次）。
    dedupFailFast: true
    # 去重 LLM 判定超时：首版 120s 实测不足（dedup prompt 含候选+新记忆，step-5
    # 判定常 >120s 而抽取 60-90s 能过——48h 观察窗提前产出的数据点），调至 240s
    # （undici headersTimeout 上限 300s 之内）
    dedupTimeoutMs: 240000

  persona:
    triggerEveryN: 50
    # 2026-10-12：14 个场景块均为真实独立主题（非碎片化），15 上限偏紧致
    # CREATE 被阻（橙色预警）——调至 20；单文件膨胀问题另跟踪上游 #1543/#1312
    maxScenes: 20

  pipeline:
    everyNConversations: 10
    enableWarmup: true
    l1IdleTimeoutSeconds: 600
    l2DelayAfterL1Seconds: 90
    l2MinIntervalSeconds: 900
    l2MaxIntervalSeconds: 3600

  recall:
    enabled: true
    maxResults: 5
    scoreThreshold: 0.3
    strategy: "keyword" # 合法值: keyword | embedding | hybrid。当前未配 embedding,用纯关键词(BM25/FTS)
    timeoutMs: 5000

  # ── 存储后端 ──
  # sqlite: 本地 SQLite (默认, 零配置)
  # tcvdb:  腾讯云向量数据库 (需填 tcvdb 配置)
  storeBackend: "sqlite"

  # 如需使用 TCVDB, 取消注释并填写:
  # storeBackend: "tcvdb"
  # tcvdb:
  #   url: "http://10.0.1.1:80"
  #   username: "root"
  #   apiKey: ""
  #   database: ""
  #   embeddingModel: "bge-large-zh"
  #   timeout: 10000

  embedding:
    provider: "none" # 默认关闭向量搜索, 仅用 BM25
    # 开启向量搜索示例:
    # provider: "openai"
    # baseUrl: "https://api.openai.com/v1"
    # apiKey: "${TDAI_LLM_API_KEY}"
    # model: "text-embedding-3-small"
    # dimensions: 1536

  bm25:
    enabled: true
    language: "zh"

# ── Skill 模块（可选，默认关闭）──
# Skill 是额外能力的加入，不影响上面的 Memory 引擎。
# 启用后 skill 数据存储在 {baseDir}/skills/ 目录下。
# 也可通过环境变量 TDAI_SKILL_ENABLED=true 启用。
# 09-13 用户拍板：开启基础档（库+10路由+检索注入），萃取档等面板 Skills 管理页批次再开。
skill:
  enabled: true
  routing:
    mode: "bm25"
    searchTopK: 20 # listing 接口最多注入多少条 skill（name+description）
  # extraction:           # 萃取档暂不开（与面板管理页捆绑，观察期结束后一批交付）
  #   enabled: true       # 需要 llm 配置有效
  #   maxIterations: 16
  resources:
    maxResourceSizeBytes: 5000000
    allowExecutable: false
