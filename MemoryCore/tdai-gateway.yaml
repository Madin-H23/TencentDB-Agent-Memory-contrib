# ============================================================
# TDAI Gateway — v3 迁移配置（2026-10-14，自 v2 upstream-eval 迁移）
# ============================================================
# 迁移来源：D:\Develop\TencentDB-Agent-Memory\repo\MemoryCore\tdai-gateway.yaml
# （v2 在役运行态，HEAD ece04f5）。对照 v3 schema（gateway/config.ts）逐键映射。
#
# ── v2 有而 v3 无（迁移损失，详见 V3-MIGRATION-TRIAGE.md）──
#   * llm 多厂商 providers[]/activeProvider —— v3 单厂商，切厂商=改本文件 baseUrl/model+重启
#   * llm.layers.l1/l2/l3 分层 model 覆盖 —— v3 全层单模型；maxTokens/timeoutMs 走 offload.*
#   * disableThinking（含 TDAI_DISABLE_THINKING env）—— v3 无思考开关，启动件该变量将被忽略
#   * llm.maxConcurrency 并发闸门 / callDeadlineMs 硬期限 / 429 退避 —— v3 全无
#   * extraction.dedupFailFast(S1 fail-closed) / dedupTimeoutMs(240s) / dedupRecallRerank(D2)
#     / attributionGuard / userIdentityNames —— v3 无这些键（放进来也会被静默忽略，故不写）；
#     v3 dedup 仍 fail-open 且查重超时硬编码 180s
# ── 密钥链 ──
#   启动件 start-gateway.bat 设 TDAI_LLM_API_KEY（阶跃 key；bat 内「DeepSeek」注释已过时）。
#   v3 经 ${TDAI_LLM_API_KEY} 整串插值取得，与 v2「provider key 缺失→全局覆盖」实际效果一致。

deployMode: standalone
stateBackend: "local"

server:
  port: 8420
  host: "127.0.0.1"
  # apiKey 不填：v2/v3 接口本机开放（127.0.0.1 绑定，行为与 v2 在役一致）

data:
  baseDir: "~/.memory-tencentdb/memory-tdai"

# ── LLM（单厂商直连；原 activeProvider=阶跃星辰）──
llm:
  baseUrl: "https://api.stepfun.com/step_plan/v1"
  apiKey: "${TDAI_LLM_API_KEY}"
  # 厂商显示名（归属移植，v2 c00899f）：纯展示字段——L1 完成/延后/失败日志与
  # 面板蒸馏记录/死信两卡的「(厂商: 模型)」归属。不参与调用路由。
  providerLabel: "阶跃星辰"
  # 全局模型（l2/l3 未显式覆盖 model 时沿用）：迁移期取 step-5-preview（判定层现值）。
  model: "step-5-preview"
  maxTokens: 65536
  timeoutMs: 120000
  # 进程级并发闸门（P1，承接 v2 在役值 4）：按 baseUrl 分桶限流，防多子系统调用
  # 叠加触发厂商并发秒拒；0/缺省=不限。10-15 4→2（用户令）：给中止调用的厂商侧
  # 幽灵请求（中止后继续推理约 7min）留出 limit 5 的余量，代价是 L1/L2/L3 共桶
  # 排队变慢（同一 stepfun baseUrl 分桶，慢层会占住槽位）。
  maxConcurrency: 2
  # 整调用硬期限（P1，承接 v2 在役值）：≥ 各层超时+一次退避预算；缺省=timeout×2+30s
  callDeadlineMs: 360000
  # 蒸馏分层覆盖（2026-10-15 移植 v2 llm.layers）。修迁移失误：v3 曾全层单模型
  # step-5-preview（含 L1 热路径），而 step-5 判死档案=单调用 1-5min/永远思考/并发
  # 幽灵——10-15 全天 dedup 240s 超时+concurrency reached 死信即该形态。l1 拨回
  # v2 在役值 step-3.7-flash；l2·l3 沿用判定层（v2 原样）。
  # 五标量字段可按层覆盖：model/maxTokens/timeoutMs/disableThinking/callDeadlineMs；
  # 未配置字段沿用全局；面板「分层配置编辑」写入同结构；改后须重启网关，看
  # [l1] 锚点行确认生效值。disableThinking 三态：true 强制关（注入
  # thinking:{type:disabled}）/ false 不注入 / 缺省回落 env TDAI_DISABLE_THINKING。
  layers:
    l1:
      model: "step-3.7-flash"
      maxTokens: 32768
      timeoutMs: 300000
      disableThinking: true
    l2:
      model: "step-5-preview"
      maxTokens: 65536
      timeoutMs: 600000
      # 整调用硬期限 660s（2026-10-15 加，v2 实证口径「全局 360s + l2/l3 660s」）：
      # 全局 360s 曾被 splice 盖死本层 600s 超时——不配这里，L2/L3 合法长调用
      # （思考开+慢判定）会在 6min 被硬顶掐死。须 ≥ timeoutMs+退避预算。
      callDeadlineMs: 660000
      # 流式（2026-10-15 加）：Node 内置 fetch(undici) headersTimeout 默认 300s，
      # 非流式「生成完才发头」会把 600s 超时静默截到 ~300s；流式即时发头绕开。
      # runner 收齐全文才返回，语义不变。
      stream: true
      disableThinking: false
    l3:
      model: "step-5-preview"
      maxTokens: 65536
      timeoutMs: 600000
      callDeadlineMs: 660000
      stream: true
      disableThinking: false

# ── Memory 引擎 ──
memory:
  capture:
    enabled: true

  extraction:
    enabled: true
    enableDedup: true
    maxMemoriesPerSession: 20
    # P0-Fix1（承接 v2 在役值）：查重失败 fail-closed——失败整批延后（游标不动、
    # 数据不丢），不再免检入库；240s=step-5 判定常 >120s 的实测口径
    # （undici headersTimeout 300s 上限之内）。
    dedupFailFast: true
    dedupTimeoutMs: 240000
    # 用户身份白名单（v2 在役值承接）：仅这些姓名可保留在「用户（X）」里，
    # 其余（第三方姓名/角色标签/路径数字/状语）入库前归一为「用户」
    userIdentityNames:
      - 何伟健
      - heweijian
      - Weijian He
    # D2 召回轻修（2026-10-14 灰度开启）：lexical=查重候选超额召回+词汇相似度重排；
    # 回退=改 none+重启
    dedupRecallRerank: lexical

  persona:
    triggerEveryN: 50
    maxScenes: 20
    triggerMode: current

  pipeline:
    everyNConversations: 5
    enableWarmup: true
    l1IdleTimeoutSeconds: 600
    l2DelayAfterL1Seconds: 90
    l2MinIntervalSeconds: 900
    l2MaxIntervalSeconds: 3600

  recall:
    enabled: true
    maxResults: 5
    scoreThreshold: 0.3
    strategy: "keyword" # v2 在役口径；v3 可选 hybrid（需 embedding）
    timeoutMs: 5000

  storeBackend: "sqlite"

  embedding:
    provider: "none"

  bm25:
    enabled: true
    language: "zh"

# （原 offload.l1MaxTokens/l1TimeoutMs/… 分层参数块已删 2026-10-15：无任何代码读取
#  的死配置，其口径已由 llm.layers 真正承接——maxTokens/timeoutMs 按层覆盖见上。）

# ── Skill 模块 ──
skill:
  enabled: true
  routing:
    mode: "bm25"
    searchTopK: 20
  # extraction 萃取档：v2 拍板「等面板批次再开」，迁移期保持关闭（v3 示例默认开，须显式关）
  extraction:
    enabled: false
  resources:
    maxResourceSizeBytes: 5000000
  # 注：v2 的 resources.allowExecutable 在 v3 未接线（写了也不拦截），已随迁移丢弃

# ── 可观测性（全部关闭，与 v2 无遥测状态一致）──
observability:
  otel:
    enabled: false
  clickhouse:
    enabled: false
  kafka:
    enabled: false
  langfuse:
    enabled: false

analytics:
  clickhouse:
    enabled: false

# ── 元数据模块（standalone 模式不启用 mongo；保留 v3 示例骨架，env 缺省为空）──
metadata:
  maxUsersPerInstance: 500
  maxTeamsPerInstance: 100
  store:
    mongoUri: "${TDAI_METADATA_MONGO_URI}"
    mongoDbPrefix: "${TDAI_METADATA_MONGO_DB_PREFIX}"
    mongoTransactions: true
  systemUser:
    memory:
      userId: "${TDAI_MEMORY_SYSTEM_USER_ID}"
      displayName: "${TDAI_MEMORY_SYSTEM_USER_NAME}"
      userKey: "${TDAI_MEMORY_SYSTEM_USER_KEY}"
